<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Step 1 - Warna Kulit | Fashion Advisor</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "surface": "#FAFAF8",
                        "surface-container": "#F1EDEC",
                        "primary": "#1C1B1B",
                        "on-primary": "#FFFFFF",
                        "outline": "#747878",
                        "outline-variant": "#C4C7C7",
                    },
                    fontFamily: {
                        "sans": ["Inter", "sans-serif"],
                    },
                    spacing: {
                        '18': '4.5rem',
                        '22': '5.5rem',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #FAFAF8; color: #1C1B1B; }
        .animate-scan { animation: scan 2.5s ease-in-out infinite; }
        @keyframes scan {
            0%, 100% { transform: translateY(-100%); }
            50% { transform: translateY(100%); }
        }
        input[type="color"] {
            border: none; width: 56px; height: 56px; border-radius: 50%; overflow: hidden; cursor: pointer; padding: 0;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 3px solid #C4C7C7; border-radius: 50%; }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased">

    <!-- Header -->
    <header class="w-full bg-white border-b border-outline-variant sticky top-0 z-10">
        <div class="max-w-2xl mx-auto px-6 py-5 flex justify-between items-center">
            <div>
                <p class="text-xs font-semibold uppercase tracking-[0.15em] text-outline mb-1">STEP 01 / 02</p>
                <h1 class="text-lg font-semibold text-primary">WARNA KULIT</h1>
            </div>
            <button onclick="location.reload()" class="text-xs font-semibold uppercase tracking-[0.1em] text-outline hover:text-primary underline">
                RESET
            </button>
        </div>
        <!-- Progress Bar -->
        <div class="w-full h-1 bg-outline-variant">
            <div class="h-full bg-primary w-1/2 transition-all duration-500"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-2xl mx-auto w-full px-6 py-10">

        <!-- Title Section -->
        <div class="mb-10">
            <h2 class="text-3xl font-semibold text-primary mb-3">Tentukan warna kulit Anda.</h2>
            <p class="text-base text-outline leading-relaxed max-w-md">
                Ini membantu kami merekomendasikan palet warna yang paling cocok untuk Anda.
            </p>
        </div>

        <!-- Tab Switcher -->
        <div class="flex p-1.5 bg-surface-container rounded-2xl mb-8">
            <button id="tab-manual-btn" class="flex-1 py-3.5 text-sm font-semibold uppercase tracking-[0.12em] rounded-xl bg-white shadow-sm text-primary transition-all" onclick="switchTab('manual')">
                Input Manual
            </button>
            <button id="tab-camera-btn" class="flex-1 py-3.5 text-sm font-semibold uppercase tracking-[0.12em] rounded-xl text-outline hover:bg-white/50 transition-all" onclick="switchTab('camera')">
                Scan Kamera
            </button>
        </div>

        <!-- Tab: Manual Input -->
        <div id="tab-manual" class="space-y-6 animate-fade-in">

            <!-- Color Picker Section -->
            <div class="bg-white border border-outline-variant rounded-2xl p-6 flex items-center gap-6">
                <input type="color" id="skin-color-picker" value="#9E867E" onchange="updateSkinHex(this.value)">
                <div class="flex-grow">
                    <label class="text-xs font-semibold uppercase tracking-[0.1em] text-outline block mb-2">Kode Warna (HEX)</label>
                    <input type="text" id="skin-hex-input" value="#9E867E" class="w-full bg-surface border border-outline-variant rounded-xl px-4 py-3.5 text-lg font-mono text-primary focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent uppercase" oninput="updateSkinHex(this.value)">
                </div>
            </div>

            <!-- Dropdowns Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="text-xs font-semibold uppercase tracking-[0.1em] text-outline block mb-2.5">Area Sampel</label>
                    <select id="sample-area" class="w-full bg-white border border-outline-variant rounded-xl px-4 py-3.5 text-sm text-primary focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent appearance-none cursor-pointer">
                        <option value="face">Wajah (Face)</option>
                        <option value="neck" selected>Leher (Neck)</option>
                        <option value="inner_arm">Lengan Dalam</option>
                        <option value="body">Badan</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-semibold uppercase tracking-[0.1em] text-outline block mb-2.5">Undertone</label>
                    <select id="undertone" class="w-full bg-white border border-outline-variant rounded-xl px-4 py-3.5 text-sm text-primary focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent appearance-none cursor-pointer">
                        <option value="Warm">Warm (Hangat)</option>
                        <option value="Cool" selected>Cool (Dingin)</option>
                        <option value="Neutral">Neutral</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="text-xs font-semibold uppercase tracking-[0.1em] text-outline block mb-2.5">Season Label (Opsional)</label>
                <select id="tone-label" class="w-full bg-white border border-outline-variant rounded-xl px-4 py-3.5 text-sm text-primary focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent appearance-none cursor-pointer">
                    <option value="">Biarkan sistem mendeteksi</option>
                    <option value="Spring">Spring</option>
                    <option value="Summer">Summer</option>
                    <option value="Autumn" selected>Autumn</option>
                    <option value="Winter">Winter</option>
                </select>
            </div>
        </div>

        <!-- Tab: Camera Scan -->
        <div id="tab-camera" class="hidden space-y-6 animate-fade-in">
            <div class="w-full aspect-[3/4] max-h-[500px] bg-black rounded-3xl relative flex items-center justify-center overflow-hidden border-4 border-white shadow-2xl">
                <div class="absolute inset-0 bg-gradient-to-br from-gray-800 to-gray-900 flex items-center justify-center">
                    <span class="material-symbols-outlined text-white/20 text-9xl">face</span>
                </div>

                <!-- Viewfinder -->
                <div class="absolute inset-12 border-2 border-white/60 rounded-3xl flex flex-col items-center justify-center">
                    <div class="w-full h-1 bg-white absolute top-1/2 left-0 animate-scan shadow-[0_0_20px_rgba(255,255,255,0.9)]"></div>
                    <div class="absolute -top-4 bg-black/80 text-white text-[10px] font-bold uppercase tracking-widest px-4 py-1.5 rounded-full">Posisikan Wajah Di Sini</div>
                </div>

                <!-- Corner Markers -->
                <div class="absolute top-10 left-10 w-8 h-8 border-t-4 border-l-4 border-white rounded-tl-2xl"></div>
                <div class="absolute top-10 right-10 w-8 h-8 border-t-4 border-r-4 border-white rounded-tr-2xl"></div>
                <div class="absolute bottom-10 left-10 w-8 h-8 border-b-4 border-l-4 border-white rounded-bl-2xl"></div>
                <div class="absolute bottom-10 right-10 w-8 h-8 border-b-4 border-r-4 border-white rounded-br-2xl"></div>
            </div>

            <button onclick="simulateCameraCapture()" class="w-full bg-primary text-on-primary font-semibold uppercase tracking-[0.12em] py-4.5 rounded-2xl hover:bg-gray-800 active:scale-[0.98] transition-all flex items-center justify-center gap-3 shadow-lg text-sm">
                <span class="material-symbols-outlined text-xl">camera</span> Ambil Sampel Warna
            </button>

            <p class="text-xs text-outline text-center leading-relaxed px-4">
                Pastikan pencahayaan alami menghadap wajah. Hindari filter atau makeup tebal untuk hasil terbaik.
            </p>
        </div>

    </main>

    <!-- Bottom Navigation -->
    <div class="w-full bg-white border-t border-outline-variant sticky bottom-0 z-10">
        <div class="max-w-2xl mx-auto px-6 py-5">
            <button onclick="goToBodyShape()" class="w-full bg-primary text-on-primary font-semibold uppercase tracking-[0.12em] py-4.5 rounded-2xl hover:bg-gray-800 active:scale-[0.98] transition-all flex items-center justify-center gap-3 shadow-lg text-sm">
                Lanjut ke Bentuk Tubuh
                <span class="material-symbols-outlined text-xl">arrow_forward</span>
            </button>
        </div>
    </div>

    <script>
        let skinToneData = {
            input_method: "manual",
            skin_hex: "#9E867E",
            sample_area: "neck",
            undertone: "Cool",
            tone_label: "Autumn",
            lab_l: 57.97,
            lab_a: 7.59,
            lab_b: 8.07
        };

        function switchTab(tab) {
            const manualTab = document.getElementById('tab-manual');
            const cameraTab = document.getElementById('tab-camera');
            const manualBtn = document.getElementById('tab-manual-btn');
            const cameraBtn = document.getElementById('tab-camera-btn');

            if (tab === 'manual') {
                manualTab.classList.remove('hidden');
                cameraTab.classList.add('hidden');
                manualBtn.classList.add('bg-white', 'shadow-sm', 'text-primary');
                manualBtn.classList.remove('text-outline', 'hover:bg-white/50');
                cameraBtn.classList.remove('bg-white', 'shadow-sm', 'text-primary');
                cameraBtn.classList.add('text-outline', 'hover:bg-white/50');
                skinToneData.input_method = "manual";
            } else {
                manualTab.classList.add('hidden');
                cameraTab.classList.remove('hidden');
                cameraBtn.classList.add('bg-white', 'shadow-sm', 'text-primary');
                cameraBtn.classList.remove('text-outline', 'hover:bg-white/50');
                manualBtn.classList.remove('bg-white', 'shadow-sm', 'text-primary');
                manualBtn.classList.add('text-outline', 'hover:bg-white/50');
                skinToneData.input_method = "camera";
            }
        }

        function updateSkinHex(val) {
            if(/^#[0-9A-F]{6}$/i.test(val)) {
                skinToneData.skin_hex = val;
                document.getElementById('skin-color-picker').value = val;
                document.getElementById('skin-hex-input').value = val;
            }
        }

        function simulateCameraCapture() {
            const btn = event.currentTarget;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-xl">progress_activity</span> Menganalisis...`;
            btn.disabled = true;

            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.disabled = false;

                skinToneData.input_method = "camera";
                skinToneData.skin_hex = "#9E867E";
                skinToneData.undertone = "Cool";
                skinToneData.tone_label = "Summer";
                skinToneData.sample_area = "face";
                skinToneData.lab_l = 57.97;
                skinToneData.lab_a = 7.59;
                skinToneData.lab_b = 8.07;

                // Update manual tab with captured data
                document.getElementById('skin-hex-input').value = "#9E867E";
                document.getElementById('skin-color-picker').value = "#9E867E";
                document.getElementById('undertone').value = "Cool";
                document.getElementById('tone-label').value = "Summer";

                alert("✅ Scan Berhasil!\n\nWarna kulit terdeteksi: Summer (Cool)\nHEX: #9E867E");
            }, 1500);
        }

        function goToBodyShape() {
            // Save to localStorage
            skinToneData.sample_area = document.getElementById('sample-area').value;
            skinToneData.undertone = document.getElementById('undertone').value;
            skinToneData.tone_label = document.getElementById('tone-label').value;

            localStorage.setItem('fashionAdvisor_skinTone', JSON.stringify(skinToneData));

            // Redirect to step 2
            window.location.href = 'body-shape.html';
        }

        // Initialize
        updateSkinHex("#9E867E");
    </script>
</body>
</html>
