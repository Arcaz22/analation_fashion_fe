<html lang="id"><head>

<style>
        body {
            background-color: #FAFAF8; /* Canvas Level 0 */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Custom Input styling for the minimalist look */
        .minimal-input {
            border: none;
            border-bottom: 1px solid #E8E8E4;
            border-radius: 0;
            background-color: transparent;
            padding: 8px 0;
            transition: border-color 0.2s ease;
        }
        .minimal-input:focus {
            outline: none;
            box-shadow: none;
            border-bottom-color: #1A1A1A;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-primary {
            background-color: #1A1A1A;
            color: #FFFFFF;
            transition: opacity 0.2s;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
<!-- Standalone Centered Card -->
<main class="w-full max-w-[420px] bg-white border border-[#E8E8E4] p-8 md:p-12 relative overflow-hidden">
<!-- Header Branding -->
<header class="mb-12 text-center">
<h1 class="font-brand-logo text-brand-logo text-primary">WARDROBE</h1>
</header>
<!-- Title & Subtitle -->
<section class="mb-10 text-center">
<h2 class="text-[20px] font-medium tracking-tight text-on-surface mb-2">Masuk ke akun Anda</h2>
<p class="font-body-md text-body-md text-[#8E8E8E]">Kelola koleksi dan rekomendasi gaya pribadi</p>
</section>
<!-- Login Form -->
<form class="flex flex-col gap-6" id="loginForm" onsubmit="handleLogin(event)">
<!-- Email Input Group -->
<div class="flex flex-col gap-2 relative">
<label class="font-label-sm text-label-sm text-secondary uppercase tracking-[0.1em]" for="email">Email</label>
<input autocomplete="email" class="minimal-input font-body-md text-body-md w-full h-[48px] text-on-surface placeholder:text-outline-variant" id="email" name="email" placeholder="nama@email.com" required="" type="email"/>
</div>
<!-- Password Input Group -->
<div class="flex flex-col gap-2 relative">
<label class="font-label-sm text-label-sm text-secondary uppercase tracking-[0.1em]" for="password">Password</label>
<div class="relative w-full h-[48px]">
<input autocomplete="current-password" class="minimal-input font-body-md text-body-md w-full h-full text-on-surface placeholder:text-outline-variant pr-10" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-0 top-1/2 -translate-y-1/2 p-2 text-secondary hover:text-primary transition-colors flex items-center justify-center" onclick="togglePassword()" type="button">
<svg fill="none" height="20" id="eyeIcon" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewbox="0 0 24 24" width="20">
<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
<circle cx="12" cy="12" r="3"></circle>
</svg>
</button>
</div>
</div>
<!-- Error Message Container -->
<div class="hidden text-error font-body-md text-body-md text-sm mt-1" id="errorMessage"></div>
<!-- Submit Button -->
<button class="btn-primary w-full h-[48px] font-label-sm text-label-sm uppercase tracking-[0.1em] mt-4 flex items-center justify-center" id="submitBtn" type="submit">
<span id="btnText">Masuk</span>
<span class="hidden" id="btnLoader">
<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
</span>
</button>
<div class="text-center mt-4">
<a class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors underline-offset-4 hover:underline" href="#">Lupa Password?</a>
</div>
</form>
</main>
<script>
        // Password Visibility Toggle
        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');

            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                // Change to eye-off SVG path
                eyeIcon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
            } else {
                pwdInput.type = 'password';
                // Change back to eye SVG path
                eyeIcon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            }
        }

        // Mock Login Logic
        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorContainer = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');

            // Reset UI
            errorContainer.classList.add('hidden');
            errorContainer.classList.remove('fade-in');
            errorContainer.textContent = '';

            // Set loading state
            submitBtn.disabled = true;
            btnText.classList.add('hidden');
            btnLoader.classList.remove('hidden');

            try {
                // 1. Simulate API POST /api/auth/login (800ms)
                await new Promise(resolve => setTimeout(resolve, 800));

                if (email === 'admin@wardrobe.app' && password === 'fashion2024') {
                    // Success path

                    // 2. Simulate GET /api/profile
                    const mockProfile = {
                        email: 'admin@wardrobe.app',
                        name: 'Admin',
                        // Simulate a new user without setup
                        skin_tone: null,
                        body_shape: null
                    };

                    // 3. Redirect logic
                    if (mockProfile.skin_tone === null || mockProfile.body_shape === null) {
                        // Simulate redirect to onboarding
                        btnText.textContent = "Redirecting to Onboarding...";
                        btnLoader.classList.add('hidden');
                        btnText.classList.remove('hidden');

                        setTimeout(() => {
                            alert("Mock Redirect: /onboarding");
                            resetBtn();
                        }, 500);
                    } else {
                        // Simulate redirect to wardrobe
                        btnText.textContent = "Redirecting to Wardrobe...";
                        btnLoader.classList.add('hidden');
                        btnText.classList.remove('hidden');

                        setTimeout(() => {
                            alert("Mock Redirect: /wardrobe");
                            resetBtn();
                        }, 500);
                    }

                } else {
                    // Invalid credentials
                    showError("Email atau password tidak valid.");
                    resetBtn();
                }
            } catch (err) {
                showError("Terjadi kesalahan sistem. Silakan coba lagi.");
                resetBtn();
            }

            function resetBtn() {
                submitBtn.disabled = false;
                btnText.textContent = "Masuk";
                btnText.classList.remove('hidden');
                btnLoader.classList.add('hidden');
            }

            function showError(msg) {
                errorContainer.textContent = msg;
                errorContainer.classList.remove('hidden');
                // trigger reflow for animation
                void errorContainer.offsetWidth;
                errorContainer.classList.add('fade-in');
            }
        }
    </script>
</body></html>
